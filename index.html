<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://dgzakcwgfxwudkejtviv.supabase.co https://wildhunk.com https://*.wildhunk.com https://makinforu.github.io; media-src 'self' blob:; connect-src 'self' https://dgzakcwgfxwudkejtviv.supabase.co wss://dgzakcwgfxwudkejtviv.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Wild hunk Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2ec;--card:#fffdf9;--ink:#16110e;--muted:#6f655c;--line:#e4dcd1;--accent:#a07a4f;--accent2:#c9a67a;--ok:#2f6b3d;--bad:#a2382b;--side:#16110e;--sideink:#e9e1d6}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Jost,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.hidden{display:none!important}
/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:16px}
.auth .box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);padding:32px 28px}
.logo{font-weight:300;font-size:26px;letter-spacing:.02em;text-decoration:none}
.logo span{font-weight:600;color:var(--accent)}
.auth h1{font-weight:400;font-size:18px;margin:18px 0 4px}
.auth p{color:var(--muted);margin:0 0 18px}
label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
label>input,label>select,label>textarea{display:block;width:100%;margin-top:5px;text-transform:none;letter-spacing:0;font-size:14.5px;color:var(--ink)}
input,select,textarea{border:1px solid var(--line);background:#fff;padding:9px 11px;border-radius:0;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:70px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--ink);color:#fff;border:1px solid var(--ink);padding:9px 18px;cursor:pointer;letter-spacing:.04em;font-size:13.5px}
.btn:hover{background:#3a2c22}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:#efe7dc}
.btn.danger{background:transparent;color:var(--bad);border-color:#e3c2bc}
.btn.danger:hover{background:#f8e9e6}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline}
.msg{font-size:13px;margin-top:10px;min-height:18px}
.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
/* layout */
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--sideink);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.side .logo{color:#fff;padding:0 10px 18px;display:block}
.side nav{display:flex;flex-direction:column;gap:2px;flex:1}
.side nav button{background:none;border:0;color:var(--sideink);text-align:left;padding:9px 12px;cursor:pointer;font-size:14px;letter-spacing:.02em}
.side nav button:hover{background:#2a201a}
.side nav button.on{background:#2f241c;color:#fff;box-shadow:inset 3px 0 0 var(--accent2)}
.side .me{font-size:12px;color:#a59a8d;padding:10px 12px;border-top:1px solid #2f241c;word-break:break-all}
.side .me button{margin-top:6px;background:none;border:1px solid #4a3c31;color:var(--sideink);padding:5px 10px;cursor:pointer;font-size:12px}
.main{padding:26px 30px 60px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h2{font-weight:400;font-size:24px;margin:0;letter-spacing:.01em}
.top .acts{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);padding:18px 20px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-weight:500;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);padding:16px 18px}
.stat small{display:block;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.stat b{display:block;font-size:26px;font-weight:400;margin-top:4px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500;background:#faf6f0}
tr:last-child td{border-bottom:0}
td .th{width:46px;height:56px;object-fit:cover;background:#eee6db;display:block}
.tablewrap{overflow-x:auto}
#appView>*{min-width:0}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;background:#efe7dc}
.pill.on{background:#e2eedf;color:var(--ok)}.pill.off{background:#f3e3e0;color:var(--bad)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 16px}
.chk{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)}
.chk input{width:auto;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{border:1px solid var(--line);background:#fff;padding:5px 11px;cursor:pointer;font-size:13px}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips button.so{background:#f3e3e0;color:var(--bad);border-color:#e3c2bc;text-decoration:line-through}
.imgs{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.imgs .im{position:relative;width:96px;height:120px;background:#eee6db;border:1px solid var(--line)}
.imgs .im img{width:100%;height:100%;object-fit:cover;display:block}
.imgs .im .ctl{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;background:rgba(22,17,14,.75)}
.imgs .im .ctl button{background:none;border:0;color:#fff;cursor:pointer;padding:3px 7px;font-size:13px}
.imgs .im .first{position:absolute;top:4px;left:4px;background:var(--accent);color:#fff;font-size:10.5px;padding:1px 6px;letter-spacing:.05em}
.imgs .add{width:96px;height:120px;border:1px dashed var(--accent);display:grid;place-items:center;text-align:center;color:var(--accent);cursor:pointer;font-size:12.5px;padding:6px;background:#fffaf3}
.hint{font-size:12.5px;color:var(--muted);margin:-6px 0 12px}
.modal{position:fixed;inset:0;background:rgba(22,17,14,.45);display:flex;justify-content:flex-end;z-index:20}
.modal .panel{background:var(--bg);width:min(760px,100%);height:100%;overflow:auto;padding:22px 24px 90px}
.modal .panel h3{font-weight:400;font-size:21px;margin:0 0 16px}
.modal .foot{position:sticky;bottom:-90px;margin:16px -24px -90px;padding:14px 24px;background:var(--card);border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.price-note{font-size:13px;color:var(--ok);margin:-4px 0 12px}
.rowitem{border:1px solid var(--line);background:#fff;padding:14px 14px 4px;margin-bottom:10px;position:relative}
.rowitem .rm{position:absolute;top:8px;right:8px}
.rowitem .mv{position:absolute;top:8px;right:84px;display:flex;gap:4px}
.thumbpick{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.thumbpick img{width:84px;height:84px;object-fit:cover;background:#eee6db;border:1px solid var(--line)}
.thumbpick .tp{flex:1;min-width:0}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.media .m{background:var(--card);border:1px solid var(--line)}
.media .m img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:#eee6db}
.media .m div{padding:7px 8px;font-size:12px;display:flex;gap:6px;justify-content:space-between;align-items:center}
.media .m span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pwm{position:fixed;inset:0;z-index:60;background:rgba(15,11,9,.6);display:grid;place-items:center;padding:16px}.pwm form{background:var(--card);padding:24px;width:min(400px,100%);display:grid;gap:12px}.pwm h3{margin:0}.pwm input{width:100%;padding:10px;border:1px solid var(--line);font:inherit}.pwm .acts{display:flex;gap:10px;justify-content:flex-end}
.pwwarn{background:#fbeee0;border:1px solid #e7c9a4;padding:12px 16px;margin:0 0 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;opacity:0;transition:.25s;z-index:50;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--bad)}
.mobilebar{display:none}
.order-items div{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px dashed var(--line)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.rank{display:flex;flex-direction:column}
.rk{display:grid;grid-template-columns:22px 40px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);text-decoration:none}
.rk:last-child{border-bottom:0}
.rk:hover .t{color:var(--accent)}
.rk .n{color:var(--muted);font-size:12px}
.rk img{width:40px;height:48px;object-fit:cover;background:#eee6db}
.rk .t{min-width:0;overflow:hidden;text-overflow:ellipsis}
.rk .t small,.rk .v small{display:block;font-size:12px;color:var(--muted)}
.rk .v{text-align:right;font-weight:500;white-space:nowrap}
.bars{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:6px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bars i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:2px 2px 0 0}
.bars span{font-size:10.5px;color:var(--muted)}
@media (max-width:860px){.dgrid{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:240px;z-index:30;transform:translateX(-100%);transition:.2s}
  .side.open{transform:none}
  .mobilebar{display:flex;align-items:center;justify-content:space-between;background:var(--side);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:10}
  .mobilebar button{background:none;border:1px solid #4a3c31;color:#fff;padding:6px 12px}
  .main{padding:18px 16px 60px}
  .grid2,.grid3,.grid4{grid-template-columns:1fr}
  .hide-m{display:none}
}
</style>
</head>
<body>

<div class="auth hidden" id="authView">
  <div class="box">
    <span class="logo">wild<span>hunk</span></span>
    <h1 id="authTitle">Admin sign in</h1>
    <p id="authSub">Only store admins can open this panel.</p>
    <form id="authForm">
      <label>Username<input type="text" id="aEmail" required autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <label id="pwWrap">Password<input type="password" id="aPass" required autocomplete="current-password"></label>
      <button class="btn" style="width:100%" id="authBtn">Sign in</button>
    </form>
    <div class="msg" id="authMsg"></div>
    <p class="hint" style="margin:14px 0 0;font-size:13px">Admin access only. Ask the store owner if you need to sign in.</p><span hidden><button id="toSignup"></button><button id="toReset"></button></span>
  </div>
</div>

<div class="auth hidden" id="claimView">
  <div class="box">
    <span class="logo">wild<span>hunk</span></span>
    <h1 id="claimTitle">Make this the owner account</h1>
    <p id="claimText">No store admin exists yet. Claim the store to become its owner. After this, nobody else can claim it.</p>
    <button class="btn" id="claimBtn" style="width:100%">Claim the store</button>
    <div class="msg" id="claimMsg"></div>
    <p style="margin:14px 0 0;font-size:13px"><button class="linkbtn" data-signout>Sign out</button></p>
  </div>
</div>

<div class="app hidden" id="appView">
  <aside class="side" id="side">
    <a class="logo" href="https://wildhunk.com/" target="_blank" rel="noopener">wild<span>hunk</span></a>
    <nav id="nav">
      <button data-v="dash" class="on">Dashboard</button>
      <button data-v="products">Products</button>
      <button data-v="orders">Orders</button>
      <button data-v="coupons">Coupons and discounts</button>
      <button data-v="home">Homepage</button>
      <button data-v="store">Store settings</button>
      <button data-v="faqs">FAQs</button>
      <button data-v="media">Image library</button>
      <button data-v="admins">Admins</button>
    </nav>
    <div class="me"><span id="meEmail"></span><br><button id="pwBtn" type="button">Change password</button> <button data-signout>Sign out</button></div>
  </aside>
  <div>
    <div class="mobilebar"><span class="logo" style="color:#fff">wild<span>hunk</span></span><button id="menuBtn">Menu</button></div>
    <main class="main" id="main"></main>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="filePick" accept="image/*" multiple hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="wizard.js"></script>
<script>
(function(){
var C=window.WH_CONFIG, sb=supabase.createClient(C.url,C.key);
var CATS=['T-shirts','Shirts','Polos','Bottoms','Winterwear','Shorts','Footwear','Accessories'];
var SIZESETS={'Clothing':['XS','S','M','L','XL','XXL','3XL'],'Footwear':['6','7','8','9','10','11','12'],'One size':['Free size'],'Waist':['28','30','32','34','36','38']};
var BADGES=['','Best Seller','Just In','New','Sale','Limited'];
var STATUSES=['new','confirmed','packed','shipped','delivered','cancelled','returned'];
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return [].slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function inr(v){return '₹'+Number(v||0).toLocaleString('en-IN')}
function toast(t,err){var el=$('#toast');el.textContent=t;el.className='toast on'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(function(){el.className='toast'},2600)}
function fail(e){console.error(e);toast((e&&e.message)||'Something went wrong',true)}
function imgUrl(u){u=u||'';return (!u||/^(https?:|data:|blob:)/.test(u))?u:"https://wildhunk.com/"+u.replace(/^\.?\//,"")}
var main=$('#main'),user=null,settings={};

// ---------- Auth ----------
var mode='in';
function showOnly(id){['authView','claimView','appView'].forEach(function(v){$('#'+v).classList.toggle('hidden',v!==id)})}
function setMode(m){mode=m;$('#authMsg').textContent='';$('#authMsg').className='msg';
  $('#pwWrap').classList.toggle('hidden',m==='reset');$('#aPass').required=m!=='reset';
  $('#authTitle').textContent={in:'Admin sign in',up:'Create the owner account',reset:'Reset your password'}[m];
  $('#authSub').textContent={in:'Only store admins can open this panel.',up:'Use the email you want to run the store with. You will claim the store right after.',reset:'We will email you a link to set a new password.'}[m];
  $('#authBtn').textContent={in:'Sign in',up:'Create account',reset:'Send reset link'}[m];
  $('#aPass').autocomplete=m==='up'?'new-password':'current-password';
  $('#toSignup').textContent=m==='in'?'Create the owner account':'Back to sign in';
}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function lockLeft(){var f=lsGet('wh_fail')||{n:0,until:0};return Math.max(0,Math.ceil((f.until-Date.now())/1000))}
function failBump(){var f=lsGet('wh_fail')||{n:0,until:0};f.n++;if(f.n>=5){f.until=Date.now()+Math.min(15*60e3,60e3*Math.pow(2,f.n-5));}lsSet('wh_fail',f)}
function failReset(){lsSet('wh_fail',{n:0,until:0})}
function pwDialog(){var m=document.createElement('div');m.className='pwm';
  m.innerHTML='<form><h3>Change password</h3><p class="hint" style="margin:0">Use at least 10 characters with letters, numbers and a symbol.</p><input type="password" id="pw1" placeholder="New password" autocomplete="new-password" required minlength="10"><input type="password" id="pw2" placeholder="Type it again" autocomplete="new-password" required minlength="10"><p class="msg" id="pwMsg"></p><div class="acts"><button type="button" class="btn ghost" data-x>Cancel</button><button class="btn">Save password</button></div></form>';
  document.body.appendChild(m);var f=m.querySelector('form'),msg=m.querySelector('#pwMsg');m.querySelector('[data-x]').onclick=function(){m.remove()};
  f.onsubmit=async function(e){e.preventDefault();var a=m.querySelector('#pw1').value,b=m.querySelector('#pw2').value;msg.className='msg err';
    if(a!==b)return msg.textContent='The two passwords do not match.';
    if(a.length<10||!/[a-z]/i.test(a)||!/[0-9]/.test(a)||!/[^a-z0-9]/i.test(a))return msg.textContent='Use at least 10 characters with letters, numbers and a symbol.';
    if(/admin@?123|password|wildhunk/i.test(a))return msg.textContent='That password is too easy to guess.';
    msg.className='msg';msg.textContent='Saving…';
    var r=await sb.auth.updateUser({password:a,data:{pw_set:true}});
    if(r.error){msg.className='msg err';msg.textContent=r.error.message;return}
    m.remove();var w=document.getElementById('pwWarn');if(w)w.remove();toast('Password changed. Use it next time you sign in.')}}
$('#pwBtn').onclick=pwDialog;
function pwNudge(){if(user&&user.user_metadata&&user.user_metadata.pw_set)return;if(document.getElementById('pwWarn'))return;
  var d=document.createElement('div');d.className='pwwarn';d.id='pwWarn';d.innerHTML='<span><b>You are still on the starter password.</b> Anyone who guesses it can change your store. Set a stronger one now.</span><button class="btn" type="button">Change password</button>';
  d.querySelector('button').onclick=pwDialog;var mn=$('#main');mn.parentNode.insertBefore(d,mn)}
$('#toSignup').onclick=function(){setMode(mode==='in'?'up':'in')};
$('#toReset').onclick=function(){setMode('reset')};
$('#authForm').onsubmit=async function(e){e.preventDefault();var em=$('#aEmail').value.trim().toLowerCase();if(em.indexOf('@')<0)em+='@wildhunk.com';var pw=$('#aPass').value,msg=$('#authMsg');var lk=lockLeft();if(lk>0){msg.className='msg err';msg.textContent='Too many failed attempts. Try again in '+lk+' seconds.';return}msg.className='msg';msg.textContent='Please wait…';
  try{
    if(mode==='in'){var r=await sb.auth.signInWithPassword({email:em,password:pw});if(r.error){failBump();throw new Error(/invalid/i.test(r.error.message)?'Wrong username or password.':r.error.message)}failReset()}
    else if(mode==='up'){var r2=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.href.split('#')[0]}});if(r2.error)throw r2.error;
      if(!r2.data.session){msg.className='msg ok';msg.textContent='Check your inbox and click the confirmation link, then sign in here.';return}}
    else{var r3=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.href.split('#')[0]});if(r3.error)throw r3.error;msg.className='msg ok';msg.textContent='Reset link sent. Check your inbox.';return}
    msg.textContent='';
  }catch(err){msg.className='msg err';msg.textContent=err.message||'Could not sign in'}
};
$$('[data-signout]').forEach(function(b){b.onclick=async function(){await sb.auth.signOut();location.hash='';}});
$('#claimBtn').onclick=async function(){var r=await sb.rpc('wh_claim_admin');if(r.error)return $('#claimMsg').textContent=r.error.message;if(r.data){boot()}else{$('#claimMsg').className='msg err';$('#claimMsg').textContent='This store already has an owner. Ask them to add you as an admin.'}};

async function boot(){
  var s=(await sb.auth.getSession()).data.session;user=s&&s.user;
  if(!user){setMode('in');if(denied){denied=false;$('#authMsg').className='msg err';$('#authMsg').textContent='This account does not have admin access.'}return showOnly('authView')}
  var st=await sb.rpc('wh_admin_state');if(st.error){showOnly('authView');$('#authMsg').className='msg err';$('#authMsg').textContent=st.error.message;return}
  if(!st.data.is_admin){denied=true;await sb.auth.signOut();return;
    showOnly('claimView');
    if(st.data.has_admin){$('#claimTitle').textContent='No admin access';$('#claimText').textContent='You are signed in as '+user.email+', but this account is not a store admin. Ask the store owner to add you under Admins.';$('#claimBtn').classList.add('hidden')}
    else{$('#claimBtn').classList.remove('hidden')}
    return}
  $('#meEmail').textContent=user.email;showOnly('appView');pwNudge();await loadSettings();go(location.hash.slice(1)||'dash');
}
var booted=false,denied=false;
sb.auth.onAuthStateChange(function(ev,session){

// ---------- Image upload ----------
function resize(file,max){return new Promise(function(res,rej){
  if(file.type==='image/gif')return res(file);
  var img=new Image(),u=URL.createObjectURL(file);img.onload=function(){var w=img.width,h=img.height,s=Math.min(1,max/Math.max(w,h));
    var c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
    c.toBlob(function(b){b?res(b):rej(new Error('Could not read image'))},'image/jpeg',.86)};img.onerror=function(){rej(new Error('Not an image: '+file.name))};img.src=u})}
async function uploadFiles(files,folder,max){var out=[];for(var i=0;i<files.length;i++){var f=files[i];
  toast('Uploading '+(i+1)+' of '+files.length+'…');
  var blob=await resize(f,max||1600),ext=blob.type==='image/gif'?'gif':'jpg';
  var path=(folder||'uploads')+'/'+Date.now()+'-'+f.name.replace(/\.[^.]+$/,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40)+'.'+ext;
  var r=await sb.storage.from(C.bucket).upload(path,blob,{contentType:blob.type||'image/jpeg',cacheControl:'31536000',upsert:false});if(r.error)throw r.error;
  out.push(sb.storage.from(C.bucket).getPublicUrl(path).data.publicUrl)}
  toast('Uploaded');return out}
function pickFiles(multiple){return new Promise(function(res){var fp=$('#filePick');fp.multiple=!!multiple;fp.value='';fp.onchange=function(){res([].slice.call(fp.files))};fp.click()})}

VIEWS.coupons=async function(){

function imgField(id,val,label){return '<div class="thumbpick"><img id="'+id+'-pv" src="'+esc(imgUrl(val))+'" alt="" onerror="this.style.opacity=.2"><div class="tp"><label>'+label+'<input id="'+id+'" value="'+esc(val||'')+'"></label><button type="button" class="btn sm ghost" data-upl="'+id+'">Upload image</button></div></div>'}
function wireImgFields(root,folder,max){root.addEventListener('click',async function(e){var b=e.target.closest('[data-upl]');if(!b)return;var fs=await pickFiles(false);if(!fs.length)return;try{var u=(await uploadFiles(fs,folder,max))[0];var inp=root.querySelector('#'+b.dataset.upl);inp.value=u;inp.dispatchEvent(new Event('input',{bubbles:true}))}catch(err){fail(err)}});
  root.addEventListener('input',function(e){if(e.target.id&&root.querySelector('#'+e.target.id+'-pv'))root.querySelector('#'+e.target.id+'-pv').src=e.target.value})}
function listEditor(title,key,fields,blank,hint){
  var items=JSON.parse(JSON.stringify(settings[key]||[]));
  main.innerHTML='<div class="top"><h2>'+title+'</h2><div class="acts"><button class="btn ghost" id="le-add">Add</button><button class="btn" id="le-save">Save</button></div></div>'+(hint?'<p class="hint" style="margin:0 0 14px">'+hint+'</p>':'')+'<div id="le"></div>';
  function draw(){$('#le').innerHTML=items.map(function(it,k){return '<div class="rowitem" data-k="'+k+'"><div class="mv"><button class="btn sm ghost" data-up="'+k+'">↑</button><button class="btn sm ghost" data-dn="'+k+'">↓</button></div><button class="btn sm danger rm" data-rm="'+k+'">Remove</button><div style="font-size:12px;color:var(--muted);margin-bottom:8px">#'+(k+1)+'</div>'+fields.map(function(f){var id='le-'+k+'-'+f[0],v=it[f[0]]==null?'':it[f[0]];
      if(f[2]==='img')return imgField(id,v,f[1]);if(f[2]==='area')return '<label>'+f[1]+'<textarea id="'+id+'" rows="2">'+esc(v)+'</textarea></label>';return '<label>'+f[1]+'<input id="'+id+'" type="'+(f[2]||'text')+'" value="'+esc(v)+'"></label>'}).join('')+'</div>'}).join('')||'<div class="empty">Nothing here yet. Use Add.</div>'}
  function read(){items.forEach(function(it,k){fields.forEach(function(f){var el=$('#le-'+k+'-'+f[0]);if(el)it[f[0]]=f[2]==='number'?+el.value:el.value})})}
  draw();wireImgFields($('#le'),key,1600);
  $('#le').addEventListener('click',function(e){var b=e.target.closest('button');if(!b||b.dataset.upl)return;read();var k;
    if(b.dataset.rm!=null){if(!confirm('Remove this item?'))return;items.splice(+b.dataset.rm,1)}else if(b.dataset.up!=null){k=+b.dataset.up;if(k>0)items.splice(k-1,0,items.splice(k,1)[0])}else if(b.dataset.dn!=null){k=+b.dataset.dn;if(k<items.length-1)items.splice(k+1,0,items.splice(k,1)[0])}draw()});
  $('#le-add').onclick=function(){read();items.push(JSON.parse(JSON.stringify(blank)));draw()};
  $('#le-save').onclick=function(){read();saveSetting(key,items).catch(fail)};
}

  var items=(settings.faqs||[]).map(function(x){return {q:x[0],a:x[1]}});settings._faqs=items;
  listEditor('FAQs','_faqs',[['q','Question'],['a','Answer','area']],{q:'',a:''});
  $('#le-save').onclick=function(){$$('#le .rowitem').forEach(function(r,k){items[k].q=$('#le-'+k+'-q').value;items[k].a=$('#le-'+k+'-a').value});saveSetting('faqs',items.filter(function(x){return x.q}).map(function(x){return [x.q,x.a]})).catch(fail)};
};

// ---------- Store settings ----------
VIEWS.store=async function(){
  var s=JSON.parse(JSON.stringify(settings.store||{}));s.announcement=s.announcement||{};s.social=s.social||{};s.trust=s.trust||['','','',''];
  function f(id,label,val,type){return '<label>'+label+'<input id="'+id+'" type="'+(type||'text')+'" value="'+esc(val==null?'':val)+'"></label>'}
  main.innerHTML='<div class="top"><h2>Store settings</h2><div class="acts"><button class="btn" id="ss">Save all</button></div></div>'+
   '<div class="card"><h3>Announcement bar</h3><label class="chk"><input type="checkbox" id="an-on"'+(s.announcement.on?' checked':'')+'> Show a strip above the header</label>'+f('an-text','Text',s.announcement.text)+f('an-link','Link (optional)',s.announcement.link)+'</div>'+
   '<div class="card"><h3>Delivery and payment</h3><div class="grid2">'+f('st-free','Free delivery above (₹)',s.free_shipping_min,'number')+f('st-cod','Cash on delivery fee (₹)',s.cod_fee,'number')+'</div></div>'+
   '<div class="card"><h3>Offers and messages</h3>'+f('st-offer','Offer box on every product page',s.offer_text)+f('st-rew','Rewards button message',s.rewards_text)+'</div>'+
   '<div class="card"><h3>Trust bar</h3><div class="grid2">'+f('st-rs','Rating score',s.rating_score)+f('st-rt','Rating text',s.rating_text)+'</div><div class="grid2">'+[0,1,2,3].map(function(k){return f('st-t'+k,'Point '+(k+1),s.trust[k])}).join('')+'</div></div>'+
   '<div class="card"><h3>Footer and contact</h3><label>About text<textarea id="st-about">'+esc(s.footer_about)+'</textarea></label>'+f('st-addr','Registered address',s.address)+'<div class="grid2">'+f('st-email','Support email',s.contact_email,'email')+f('st-phone','Support phone',s.contact_phone)+'</div><div class="grid3">'+f('so-ig','Instagram link',s.social.instagram)+f('so-yt','YouTube link',s.social.youtube)+f('so-fb','Facebook link',s.social.facebook)+'</div></div>';
  $('#ss').onclick=function(){var v=function(id){return $('#'+id).value.trim()};
    s.announcement={on:$('#an-on').checked,text:v('an-text'),link:v('an-link')};s.free_shipping_min=+v('st-free')||0;s.cod_fee=+v('st-cod')||0;s.offer_text=v('st-offer');s.rewards_text=v('st-rew');s.rating_score=v('st-rs');s.rating_text=v('st-rt');
    s.trust=[0,1,2,3].map(function(k){return v('st-t'+k)});s.footer_about=v('st-about');s.address=v('st-addr');s.contact_email=v('st-email');s.contact_phone=v('st-phone');s.social={instagram:v('so-ig'),youtube:v('so-yt'),facebook:v('so-fb')};
    saveSetting('store',s).catch(fail)};
};

// ---------- Media ----------
VIEWS.media=async function(){
  main.innerHTML='<div class="top"><h2>Image library</h2><div class="acts"><button class="btn" id="mu">Upload images</button></div></div><p class="hint" style="margin:0 0 14px">Every image you upload is kept here. Copy a link to use it anywhere in the admin.</p><div class="media" id="mg"></div>';
  var folders=['products','hero','collections','budgets','uploads'],files=[];
  for(var i=0;i<folders.length;i++){var r=await sb.storage.from(C.bucket).list(folders[i],{limit:500,sortBy:{column:'created_at',order:'desc'}});if(r.error)throw r.error;r.data.filter(function(x){return x.id}).forEach(function(x){files.push({path:folders[i]+'/'+x.name,at:x.created_at})})}
  files.sort(function(a,b){return a.at<b.at?1:-1});
  $('#mg').innerHTML=files.length?files.map(function(f){var u=sb.storage.from(C.bucket).getPublicUrl(f.path).data.publicUrl;return '<div class="m"><img src="'+esc(u)+'" loading="lazy" alt=""><div><button class="btn sm ghost" data-copy="'+esc(u)+'">Copy link</button><button class="btn sm danger" data-del="'+esc(f.path)+'">✕</button></div></div>'}).join(''):'<div class="empty">No uploads yet. The original photos live with the site files (img/…) and still work.</div>';
  $('#mg').onclick=async function(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.copy){navigator.clipboard.writeText(b.dataset.copy).then(function(){toast('Link copied')})}else if(confirm('Delete this image? Anything still using it will show a blank.')){var r2=await sb.storage.from(C.bucket).remove([b.dataset.del]);if(r2.error)return fail(r2.error);VIEWS.media()}};
  $('#mu').onclick=async function(){var fs=await pickFiles(true);if(!fs.length)return;try{await uploadFiles(fs,'uploads',1600);VIEWS.media()}catch(err){fail(err)}};
};

// ---------- Admins ----------
VIEWS.admins=async function(){
  var r=await sb.from('wh_admins').select('*').order('created_at');if(r.error)throw r.error;
  main.innerHTML='<div class="top"><h2>Admins</h2></div><div class="card"><h3>People who can open this panel</h3><div class="tablewrap"><table><tr><th>Email</th><th>Added</th><th></th></tr>'+r.data.map(function(a){return '<tr><td>'+esc(a.email)+(a.user_id===user.id?' <span class="pill">you</span>':'')+'</td><td>'+new Date(a.created_at).toLocaleDateString('en-IN')+'</td><td>'+(a.user_id===user.id?'':'<button class="btn sm danger" data-rm="'+a.user_id+'">Remove</button>')+'</td></tr>'}).join('')+'</table></div></div>'+
   '<div class="card"><h3>Add an admin</h3><p class="hint" style="margin:0 0 12px">Ask them to open this page and use "Create the owner account" first, then add their email here.</p><form id="aa" style="display:flex;gap:8px;flex-wrap:wrap"><input id="aa-email" type="email" required placeholder="name@example.com" style="flex:1;min-width:200px"><button class="btn">Add admin</button></form></div>';
  $('#aa').onsubmit=async function(e){e.preventDefault();var r2=await sb.rpc('wh_add_admin',{p_email:$('#aa-email').value.trim()});if(r2.error)return fail(r2.error);if(!r2.data)return toast('No account with that email yet. Ask them to sign up first.',true);toast('Admin added');VIEWS.admins()};
  main.onclick=async function(e){var b=e.target.closest('[data-rm]');if(!b)return;if(!confirm('Remove this admin?'))return;var r3=await sb.from('wh_admins').delete().eq('user_id',b.dataset.rm);if(r3.error)return fail(r3.error);VIEWS.admins()};
};
})();
</script>
</body>
</html>
